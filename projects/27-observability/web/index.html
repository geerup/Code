<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Observability</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0f; color: #e8e8ef; padding: 20px; }
  h1 { font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .card { background: #12121b; border: 1px solid #2a2a38; border-radius: 12px; padding: 16px; }
  .card .label { font-size: 12px; color: #5bc0be; text-transform: uppercase; letter-spacing: .5px; }
  .card .val { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .card .sub { font-size: 12px; color: #888; margin-top: 4px; }
  pre { background: #11111a; border: 1px solid #2a2a38; border-radius: 10px; padding: 12px; overflow: auto; font-size: 11px; color: #9fe; }
</style>
</head>
<body>
<h1>🔭 Observability Dashboard</h1>
<div class="grid" id="cards"></div>
<h2 style="font-size:14px">/metrics (Prometheus)</h2>
<pre id="prom">loading…</pre>
<script>
  async function tick() {
    try {
      const j = await (await fetch('/metrics.json')).json();
      const prom = await (await fetch('/metrics')).text();
      const cards = [];
      for (const [k, v] of Object.entries(j.counters)) cards.push(card(k, Math.round(v), 'counter'));
      for (const [k, v] of Object.entries(j.gauges)) cards.push(card(k, v.toFixed(1), 'gauge'));
      for (const [k, h] of Object.entries(j.histograms))
        cards.push(card(k, h.p50 + 'ms', `p90 ${h.p90} · p99 ${h.p99} · avg ${h.avg}`));
      document.getElementById('cards').innerHTML = cards.join('');
      document.getElementById('prom').textContent = prom;
    } catch (e) {
      document.getElementById('prom').textContent = 'Run `python server.py` to serve live metrics.';
    }
  }
  function card(label, val, sub) {
    return `<div class="card"><div class="label">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
