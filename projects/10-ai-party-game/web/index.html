<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Party Game</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0f; color: #e8e8ef; display: grid; place-items: center; min-height: 100vh; }
  .box { width: min(520px, 94vw); background: #12121b; border: 1px solid #2a2a38; border-radius: 14px; padding: 22px; }
  h1 { font-size: 17px; }
  input, button { font-size: 14px; border-radius: 8px; padding: 9px 12px; }
  input { background: #16161f; color: #eee; border: 1px solid #33333f; }
  button { background: #5bc0be; color: #06121a; border: 0; font-weight: 600; cursor: pointer; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .prompt { background: #1b1b27; border-radius: 10px; padding: 14px; font-size: 16px; margin: 12px 0; }
  .players { font-size: 13px; color: #aaa; }
  .board { margin-top: 12px; font-size: 14px; }
  .board div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #23232e; }
  .hint { font-size: 12px; color: #777; }
</style>
</head>
<body>
<div class="box">
  <h1>🎉 AI Party Game</h1>
  <div id="setup">
    <div class="row"><input id="name" placeholder="your name" /></div>
    <div class="row">
      <button id="create">Create room</button>
      <input id="code" placeholder="room code" style="width:120px" />
      <button id="join">Join</button>
    </div>
    <p class="hint">Create a room, share the code, and play on multiple devices. An AI judges each round.</p>
  </div>
  <div id="game" style="display:none">
    <div class="players" id="players"></div>
    <div class="prompt" id="prompt">Waiting…</div>
    <div class="row" id="answerRow" style="display:none">
      <input id="answer" placeholder="your funniest answer" style="flex:1" />
      <button id="submit">Send</button>
    </div>
    <div class="row">
      <button id="start">Start round</button>
      <button id="reveal">Reveal (judge)</button>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>
<script>
  const pid = 'p' + Math.random().toString(36).slice(2, 8);
  let code = null;
  const $ = (id) => document.getElementById(id);
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json());

  $('create').onclick = async () => { const r = await post('/create'); code = r.code; $('code').value = code; await doJoin(); };
  $('join').onclick = () => { code = $('code').value.toUpperCase(); doJoin(); };
  async function doJoin() {
    if (!code || !$('name').value) return alert('Enter a name (and have a room code).');
    await post('/join/' + code, { player_id: pid, name: $('name').value });
    $('setup').style.display = 'none'; $('game').style.display = 'block';
    poll(); setInterval(poll, 1500);
  }
  $('start').onclick = () => post('/start/' + code);
  $('reveal').onclick = () => post('/reveal/' + code);
  $('submit').onclick = async () => { await post('/submit/' + code, { player_id: pid, answer: $('answer').value }); $('answer').value = ''; };

  async function poll() {
    if (!code) return;
    const s = await fetch('/state/' + code).then(r => r.json()).catch(() => null);
    if (!s) return;
    $('players').textContent = 'Players: ' + s.players.map(p => p.name + (p.answered ? ' ✅' : '')).join(', ');
    $('prompt').textContent = s.phase === 'answering' ? '✍️ ' + s.prompt : (s.phase === 'reveal' ? '🏆 Round ' + s.round + ' revealed!' : 'Press Start round');
    $('answerRow').style.display = s.phase === 'answering' ? 'flex' : 'none';
    $('board').innerHTML = s.scoreboard.map(p => `<div><span>${p.name}</span><span>${p.score}</span></div>`).join('');
  }
</script>
</body>
</html>
