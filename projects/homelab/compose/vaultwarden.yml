# Sanitized template — bind addresses, domains, and tokens are placeholders.
#
# Vaultwarden — Bitwarden-compatible secrets manager. This holds real credentials,
# so it is the service that most needs zero public exposure: overlay bind only.
# ADMIN_TOKEN is a SECRET — supply via .env, never commit a real value.

services:
  vaultwarden:
    image: vaultwarden/server:1.34-alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # Argon2 PHC-format hash of the admin token; supplied via .env. SECRET.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      DOMAIN: http://${VAULTWARDEN_DOMAIN}:${VAULTWARDEN_HTTP_PORT}
      # New signups closed by default; invite from the admin panel over the overlay.
      SIGNUPS_ALLOWED: "false"
      SENDS_ALLOWED: "true"
    volumes:
      - vaultwarden-data:/data
    ports:
      # OVERLAY-ONLY BIND: never expose a secrets manager on 0.0.0.0.
      - "${OVERLAY_BIND_ADDR}:${VAULTWARDEN_HTTP_PORT}:80"

volumes:
  vaultwarden-data:
