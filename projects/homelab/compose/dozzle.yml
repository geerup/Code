# Sanitized template — bind addresses, domains, and tokens are placeholders.
#
# Dozzle — real-time Docker log viewer. Read-only mount of the Docker socket,
# reachable only over the overlay.

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_LEVEL: info
      # Enable Dozzle's own auth in addition to overlay isolation.
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      # Read-only socket: Dozzle reads logs, it does not control containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # If using simple auth, mount a users file (see Dozzle docs). Placeholder path:
      - ${DOZZLE_USERS_FILE}:/data/users.yml:ro
    ports:
      # OVERLAY-ONLY BIND: bind to the overlay interface, never 0.0.0.0.
      - "${OVERLAY_BIND_ADDR}:${DOZZLE_HTTP_PORT}:8080"
