# monitoring.yml — Prometheus + Grafana + node_exporter + smartctl_exporter
#
# Binding pattern (matches the rest of the homelab): every published port binds
# to ${BIND_ADDR}, which should be set in .env to this host's WireGuard overlay
# address. Nothing listens on LAN or WAN interfaces. The default of 127.0.0.1
# means a bare `docker compose up` exposes nothing beyond the host itself.
#
# Deploy:   docker compose -f compose/monitoring.yml --env-file .env up -d
# Verify:   curl -s http://${BIND_ADDR}:9090/-/healthy

services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      # Credentials come from .env — never commit real values. See .env.example.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    # No published port: only Prometheus scrapes it, over the compose network.
    # Remote hosts run node_exporter natively and are scraped over the overlay
    # (see prometheus/prometheus.yml).
    networks:
      - monitoring

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.12.0
    container_name: smartctl-exporter
    restart: unless-stopped
    # smartctl issues raw ATA/NVMe commands to the disks, which requires
    # privileged access to the device nodes. Scope is limited by mounting
    # /dev read-only and not publishing any port to the host.
    privileged: true
    user: root
    volumes:
      - /dev:/dev:ro
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
