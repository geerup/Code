<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>microfeed</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0f; color: #e8e8ef; }
  .app { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; }
  input, button, textarea { font-size: 14px; border-radius: 8px; padding: 9px 12px; }
  input, textarea { background: #16161f; color: #eee; border: 1px solid #33333f; width: 100%; box-sizing: border-box; }
  button { background: #5bc0be; color: #06121a; border: 0; font-weight: 600; cursor: pointer; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .tabs { display: flex; gap: 8px; margin: 12px 0; }
  .tabs button { background: #16161f; color: #ccc; border: 1px solid #33333f; }
  .tabs button.active { background: #5bc0be; color: #06121a; }
  .post { background: #12121b; border: 1px solid #2a2a38; border-radius: 12px; padding: 12px; margin: 8px 0; }
  .post .meta { font-size: 12px; color: #8ab; }
  .post .text { margin: 6px 0; }
  .like { background: none; border: 0; color: #e76f51; cursor: pointer; font-size: 13px; padding: 0; }
  .muted { color: #777; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <h1>🐦 microfeed <span class="muted">— a niche real-time microblog</span></h1>
  <div id="auth">
    <div class="row"><input id="user" placeholder="username" /></div>
    <div class="row"><input id="pass" type="password" placeholder="password" /></div>
    <div class="row"><button id="register">Sign up</button><button id="login" style="background:#16161f;color:#ccc;border:1px solid #33333f">Log in</button></div>
  </div>
  <div id="main" style="display:none">
    <div class="row"><textarea id="compose" rows="2" maxlength="280" placeholder="What's happening? (280 chars)"></textarea></div>
    <div class="row"><button id="post">Post</button></div>
    <div class="tabs"><button id="tabFeed" class="active">Following</button><button id="tabExplore">Explore</button></div>
    <div id="posts"></div>
  </div>
</div>
<script>
  let token = null, tab = 'feed';
  const $ = (id) => document.getElementById(id);
  const api = (path, method, body) => fetch('/api' + path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json());

  $('register').onclick = () => authCall('/register');
  $('login').onclick = () => authCall('/login');
  async function authCall(path) {
    const r = await api(path, 'POST', { username: $('user').value, password: $('pass').value });
    if (r.token) { token = r.token; $('auth').style.display = 'none'; $('main').style.display = 'block'; load(); subscribe(); }
    else alert(r.error || 'failed');
  }
  $('post').onclick = async () => { const t = $('compose').value.trim(); if (!t) return; await api('/posts', 'POST', { text: t }); $('compose').value = ''; load(); };
  $('tabFeed').onclick = () => { tab = 'feed'; setTabs(); load(); };
  $('tabExplore').onclick = () => { tab = 'explore'; setTabs(); load(); };
  function setTabs() { $('tabFeed').classList.toggle('active', tab === 'feed'); $('tabExplore').classList.toggle('active', tab === 'explore'); }

  async function load() {
    const r = await api('/' + tab);
    $('posts').innerHTML = (r.posts || []).map(p => `
      <div class="post">
        <div class="meta">@${p.author} · ${new Date(p.created_at).toLocaleTimeString()}</div>
        <div class="text">${escape(p.text)}</div>
        <button class="like" onclick="like('${p.id}')">${p.liked_by_me ? '♥' : '♡'} ${p.likes}</button>
        ${tab === 'explore' ? `<button class="like" style="color:#5bc0be;margin-left:10px" onclick="follow('${p.author_id}')">+ follow</button>` : ''}
      </div>`).join('') || '<p class="muted">Nothing here yet.</p>';
  }
  window.like = async (id) => { await api('/posts/' + id + '/like', 'POST'); load(); };
  window.follow = async (id) => { await api('/follow/' + id, 'POST'); };
  function subscribe() { const es = new EventSource('/api/events?token=' + token); es.onmessage = () => { if (tab === 'feed' || tab === 'explore') load(); }; }
  function escape(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
