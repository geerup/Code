name: python-ci
on:
  push:
    paths:
      - 'projects/05-agentic-task-runner/**'
      - 'projects/07-ai-games-bridge/**'
      - 'projects/11-eval-harness/**'
      - 'projects/12-multi-agent-research/**'
      - 'projects/13-chat-bot/**'
      - 'projects/16-semantic-code-search/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - projects/05-agentic-task-runner
          - projects/07-ai-games-bridge
          - projects/11-eval-harness
          - projects/12-multi-agent-research
          - projects/13-chat-bot
          - projects/16-semantic-code-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: python -m unittest discover -s tests
