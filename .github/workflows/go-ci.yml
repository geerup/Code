name: go-ci
on:
  push:
    paths:
      - 'projects/01-social-app/**'
      - 'projects/02-multiplayer-arena/**'
      - 'projects/06-code-review-cli/**'
      - 'projects/08-vector-search/**'
      - 'projects/22-leaderboard-service/**'
      - 'projects/24-kv-store/**'
      - 'projects/25-message-queue/**'
      - 'projects/26-rate-limiter/**'
      - 'projects/29-saas-starter/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - projects/01-social-app
          - projects/02-multiplayer-arena
          - projects/06-code-review-cli
          - projects/08-vector-search
          - projects/22-leaderboard-service
          - projects/24-kv-store
          - projects/25-message-queue
          - projects/26-rate-limiter
          - projects/29-saas-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test ./...
          go build ./...
