name: go-ci
on:
  push:
    paths:
      - 'projects/02-multiplayer-arena/**'
      - 'projects/06-code-review-cli/**'
      - 'projects/22-leaderboard-service/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - projects/02-multiplayer-arena
          - projects/06-code-review-cli
          - projects/22-leaderboard-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test ./...
          go build ./...
