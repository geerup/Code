# TEMPLATE — replace with your running config (sanitized) before publishing
#
# Uptime Kuma — status/monitoring dashboard. Probes services on the overlay and
# is itself reachable only over the overlay.

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      # OVERLAY-ONLY BIND: bind to the overlay interface, never 0.0.0.0.
      - "${OVERLAY_BIND_ADDR}:${UPTIME_KUMA_HTTP_PORT}:3001"

volumes:
  uptime-kuma-data:
