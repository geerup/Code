# Example inventory — copy to inventory.ini and fill in your real hosts.
# inventory.ini is gitignored on purpose: real hostnames/IPs never get committed.

[homelab]
mele.example.internal        ansible_host=192.0.2.10

[edge]
uconsole.example.internal    ansible_host=192.0.2.20

# Hosts that get the full stack (docker + overlay + services)
[stack:children]
homelab

# Hosts that only get the base OS config + overlay client
[clients:children]
edge

[all:vars]
ansible_user=admin
ansible_python_interpreter=auto_silent
